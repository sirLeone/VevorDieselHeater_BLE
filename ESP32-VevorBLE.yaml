substitutions:
  name: bt-vevor_ble
  friendly_name: Diesel_Air_Heater
  # MAC address of the heater's BLE module
  heater_mac: "21:47:08:1a:b1:1e"
  # Heater password (AirHeaterBLE app -> Settings -> Password). Factory default: 1234
  heater_passkey: "1234"
  # How often the heater status is requested
  poll_interval: 5s

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
#  platformio_options:
#    board_build.f_cpu: 120000000L
#    board_build.f_cpu: 240000000L

esp32:
  board: esp32dev
  framework:
    type: arduino

esp32_ble_tracker:

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key
  actions:
    # Send any command frame to the heater, e.g. cmd: 3, value: 1 (power ON).
    # See PROTOCOL.md for the full list of commands.
    - action: send_command
      variables:
        cmd: int
        value: int
      then:
        - script.execute:
            id: send_command
            cmd: !lambda "return cmd;"
            value: !lambda "return value;"

ota:
  platform: esphome
  password: !secret ota_password

# Web Server
# if you use home assistant and have frequent disconnections. disable the web_server
web_server:
  port: 80
  version: 3

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "VevorBLE Hotspot"
    password: "12345678"

ble_client:
  - mac_address: ${heater_mac}
    id: heater_ble
    on_connect:
      then:
        - lambda: "id(ble_connected) = true;"
        - script.execute:
            id: send_command
            cmd: 1
            value: 0
    on_disconnect:
      then:
        - lambda: |-
            id(ble_connected) = false;
            id(heater_connected).publish_state(false);

# Global variables
globals:
  - id: ble_connected
    type: bool
    initial_value: "false"
  # millis() of the last valid status frame
  - id: last_frame_ms
    type: uint32_t
    initial_value: "0"
  # Last values reported by the heater
  - id: current_mode
    type: int
    initial_value: "1"  # 0 = unknown, 1 = LEVEL, 2 = AUTOMATIC (temperature)
  - id: current_set_level
    type: int
    initial_value: "1"
  - id: current_set_temp
    type: int
    initial_value: "20"
  # Active error code (0 = no fault). Like the app, mode/level/temperature changes are blocked on error.
  - id: current_error
    type: int
    initial_value: "0"

  # Timer: Unix time when timed heating ends (0 = not active). Restored after a reboot.
  - id: timer_off_at
    type: uint32_t
    restore_value: true
    initial_value: "0"
  # millis() when timed heating was started
  - id: timer_started_ms
    type: uint32_t
    initial_value: "0"

script:
  # Builds and sends one command frame:
  # [0xAA, 0x55, passkey/100, passkey%100, cmd, value low, value high, checksum]
  # Commands are queued and spaced so the heater can process each one.
  - id: send_command
    mode: queued
    max_runs: 10
    parameters:
      cmd: int
      value: int
    then:
      - if:
          condition:
            lambda: |-
              if ((cmd == 2 || cmd == 4) && id(current_error) != 0) {
                ESP_LOGW("heater", "Heater error %d active, command %d (value %d) blocked", id(current_error), cmd, value);
                return false;
              }
              return id(ble_connected);
          then:
            - ble_client.ble_write:
                id: heater_ble
                service_uuid: 0000ffe0-0000-1000-8000-00805f9b34fb
                characteristic_uuid: 0000ffe1-0000-1000-8000-00805f9b34fb
                value: !lambda |-
                  const uint16_t passkey = ${heater_passkey};
                  std::vector<uint8_t> frame = {
                    0xAA, 0x55,
                    (uint8_t) (passkey / 100), (uint8_t) (passkey % 100),
                    (uint8_t) cmd,
                    (uint8_t) (value & 0xFF), (uint8_t) ((value >> 8) & 0xFF),
                    0x00};
                  frame[7] = (uint8_t) (frame[2] + frame[3] + frame[4] + frame[5] + frame[6]);
                  ESP_LOGD("heater", "Sending: %s", format_hex_pretty(frame).c_str());
                  return frame;
            - delay: 500ms
          else:
            - logger.log:
                level: WARN
                format: "Command %d (value %d) not sent"
                args: ["cmd", "value"]

  # Switch the operating mode only when needed (1 = LEVEL, 2 = AUTOMATIC)
  - id: ensure_mode
    mode: queued
    parameters:
      target_mode: int
    then:
      - if:
          condition:
            lambda: "return id(current_mode) != target_mode;"
          then:
            - lambda: "id(current_mode) = target_mode;"
            - script.execute:
                id: send_command
                cmd: 2
                value: !lambda "return target_mode;"

  - id: set_level
    mode: queued
    parameters:
      level: int
    then:
      - script.execute:
          id: ensure_mode
          target_mode: 1
      - lambda: "id(current_set_level) = level;"
      - script.execute:
          id: send_command
          cmd: 4
          value: !lambda "return std::max(1, std::min(10, level));"

  - id: set_temperature
    mode: queued
    parameters:
      temperature: int
    then:
      - script.execute:
          id: ensure_mode
          target_mode: 2
      - lambda: "id(current_set_temp) = temperature;"
      - script.execute:
          id: send_command
          cmd: 4
          value: !lambda "return std::max(8, std::min(36, temperature));"

  # Turns the heater on for "Timer Duration" minutes
  - id: start_timed_heating
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(ha_time).now().is_valid();"
          then:
            - lambda: |-
                const uint32_t minutes = (uint32_t) id(timer_duration).state;
                id(timer_off_at) = id(ha_time).now().timestamp + minutes * 60;
                id(timer_started_ms) = millis();
                ESP_LOGI("timer", "Timed heating for %u min", (unsigned) minutes);
            - script.execute:
                id: send_command
                cmd: 3
                value: 1
            - script.execute: update_timer_remaining
          else:
            - logger.log:
                level: WARN
                format: "Time not synchronized with Home Assistant, timed heating not started"

  - id: update_timer_remaining
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          float remaining = 0;
          if (id(timer_off_at) != 0 && now.is_valid() && (uint32_t) now.timestamp < id(timer_off_at)) {
            remaining = ceilf((id(timer_off_at) - (uint32_t) now.timestamp) / 60.0f);
          }
          id(timer_remaining).publish_state(remaining);

interval:
  - interval: ${poll_interval}
    then:
      - script.execute:
          id: send_command
          cmd: 1
          value: 0
  # End of timed heating
  - interval: 30s
    then:
      - if:
          condition:
            lambda: |-
              auto now = id(ha_time).now();
              return id(timer_off_at) != 0 && now.is_valid() && (uint32_t) now.timestamp >= id(timer_off_at);
          then:
            - logger.log: "Timed heating finished, turning the heater off"
            - switch.turn_off: heater_power
      - script.execute: update_timer_remaining
  # Mark the heater offline when no status frame arrived for 30s
  - interval: 10s
    then:
      - lambda: |-
          bool online = id(ble_connected) && id(last_frame_ms) != 0 &&
                        (millis() - id(last_frame_ms)) < 30000;
          id(heater_connected).publish_state(online);

text_sensor:
  - platform: template
    name: "Glow Plug Status"
    id: running_step_text
    icon: "mdi:induction"
  - platform: template
    name: "Heater Mode"
    id: heater_mode_text
  - platform: template
    name: "Error"
    id: error_text
    icon: "mdi:alert-circle-outline"
  - platform: template
    name: "Display Error"
    id: display_error_text
    icon: "mdi:alert-circle-outline"
  - platform: template
    name: "Protocol"
    id: protocol_variant
    icon: "mdi:bluetooth-settings"
    entity_category: diagnostic
  - platform: template
    name: "Last Frame"
    id: last_frame
    icon: "mdi:code-brackets"
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "Heater Status"
    id: heater_running
  - platform: template
    name: "Heater Connected"
    id: heater_connected
    device_class: connectivity
    entity_category: diagnostic

# Sensors for status reporting
sensor:
  - platform: uptime
    name: Uptime Sensor

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: ble_client
    type: rssi
    ble_client_id: heater_ble
    name: "Heater BLE RSSI"
    update_interval: 60s

  - platform: template
    name: "Error Code"
    id: error_code
    accuracy_decimals: 0
    icon: "mdi:alert-circle-outline"

  - platform: template
    name: "Controller Error Code"
    id: controller_error_code
    accuracy_decimals: 0
    icon: "mdi:alert-circle-outline"
    entity_category: diagnostic

  - platform: template
    name: "Running Step"
    id: running_step
    accuracy_decimals: 0
    icon: "mdi:state-machine"
    entity_category: diagnostic

  - platform: template
    name: "Battery Voltage"
    id: battery_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: voltage
    state_class: measurement
    icon: "mdi:car-battery"

  - platform: template
    name: "Altitude"
    unit_of_measurement: 'm'
    id: altitude
    device_class: distance
    accuracy_decimals: 0
    icon: "mdi:summit"

  - platform: template
    name: "Power Status"
    id: heater_set_point
    accuracy_decimals: 0
    icon: "mdi:speedometer"

  - platform: template
    name: "Fan Speed"
    id: fan_speed
    accuracy_decimals: 0
    icon: "mdi:fan"

  - platform: template
    name: "Room Temperature"
    id: room_temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    device_class: temperature
    state_class: measurement
    icon: "mdi:home-thermometer"

  - platform: template
    name: "Heating Temperature"
    id: heating_temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    device_class: temperature
    state_class: measurement
    icon: "mdi:radiator"

  - platform: template
    name: "Timer Remaining"
    id: timer_remaining
    unit_of_measurement: "min"
    accuracy_decimals: 0
    icon: "mdi:timer-sand"

  - platform: ble_client
    type: characteristic
    id: heater_status_frame
    ble_client_id: heater_ble
    service_uuid: "0000ffe0-0000-1000-8000-00805f9b34fb"
    characteristic_uuid: "0000ffe1-0000-1000-8000-00805f9b34fb"
    name: "BLE Raw Data"
    internal: true
    notify: true
    lambda: |-
      // Status frame layout (AirHeaterBLE app, protocols "AA 55" and "AA 66", see PROTOCOL.md):
      //  0-1 header | 2 command | 3 running state | 4 error | 5 running step | 6-7 altitude
      //  8 mode | 9 set level/temp | 10 actual level-1 | 11-12 voltage*10 | 13-14 heat exchanger temp
      //  15-16 room temp | 17 display error code (AA 55) / error (AA 66) | 18 reserved | 19 checksum
      static const char *const steps[] = {"Warmup", "Self test running", "Ignition", "Heating", "Shutting down", "Standby"};
      // Controller error codes (byte 4 of AA 55 frames), translated from the Chinese texts of the app
      static const char *const controller_errors[] = {
          "No fault", "Startup failure", "Flame-out, lack of fuel", "Supply voltage abnormal",
          "Air outlet sensor fault", "Air inlet sensor fault", "Fuel pump fault", "Fan fault", "Glow plug fault",
          "Overheat protection", "Heat exchanger temperature sensor fault"};
      // Panel error codes E-01..E-10 (byte 17: display error of AA 55, error of AA 66).
      // 2 and 7 are not named in the app, they are taken from the heater manuals.
      static const char *const panel_errors[] = {
          "No fault", "Supply voltage abnormal", "Overvoltage", "Glow plug fault", "Fuel pump fault",
          "Overheat protection", "Fan fault", "Communication fault", "Flame-out, lack of fuel",
          "Overheat sensor fault", "Repeated startup failure"};
      auto describe = [](const char *const *table, uint8_t code) -> std::string {
        char text[64];
        if (code == 0) return table[0];
        if (code > 10) snprintf(text, sizeof(text), "E-%02d Unknown error", code);
        else snprintf(text, sizeof(text), "E-%02d %s", code, table[code]);
        return text;
      };

      if (x.size() < 17 || x[0] != 0xAA || (x[1] != 0x55 && x[1] != 0x66)) {
        ESP_LOGW("heater", "Unsupported frame (%u bytes): %s", (unsigned) x.size(), format_hex_pretty(x).c_str());
        id(last_frame).publish_state(format_hex_pretty(x));
        return NAN;
      }
      ESP_LOGD("heater", "Received: %s", format_hex_pretty(x).c_str());
      id(last_frame_ms) = millis();
      id(heater_connected).publish_state(true);

      const bool aa66 = x[1] == 0x66;
      const uint8_t running_state = x[3];
      const uint8_t step = x[5];
      const uint8_t mode = x[8];
      const uint8_t controller_error = x[4];
      const uint8_t display_error = x.size() > 17 ? x[17] : 0;
      // The app reads the error from byte 4 for AA 55 and from byte 17 for AA 66
      const uint8_t error = aa66 ? display_error : controller_error;

      int set_level = -1;
      int set_temp = -1;
      int actual_level = -1;
      if (mode == 1) {
        set_level = x[9];
        actual_level = x[9];
      } else if (mode == 2) {
        set_temp = x[9];
        actual_level = x[10] + 1;
      } else if (mode == 0) {
        actual_level = x[10] + 1;
      }

      id(protocol_variant).publish_state(aa66 ? "AA 66" : "AA 55");
      id(heater_running).publish_state(running_state > 0);
      id(heater_mode_text).publish_state(mode == 2 ? "Automatic" : "Level");
      id(running_step).publish_state(step);
      if (running_state == 0 && step == 0) {
        id(running_step_text).publish_state("Standby");
      } else if (step < sizeof(steps) / sizeof(steps[0])) {
        id(running_step_text).publish_state(steps[step]);
      } else {
        ESP_LOGD("heater", "Unknown running step: %d", step);
      }

      id(current_error) = error;
      if (error != 0) {
        ESP_LOGW("heater", "Heater error %d (controller %d, display %d)", error, controller_error, display_error);
      }
      id(error_code).publish_state(display_error);
      id(controller_error_code).publish_state(controller_error);
      id(error_text).publish_state(aa66 ? describe(panel_errors, error) : describe(controller_errors, error));
      id(display_error_text).publish_state(describe(panel_errors, display_error));

      id(altitude).publish_state(x[6] | (x[7] << 8));
      id(battery_voltage).publish_state((x[11] | (x[12] << 8)) / 10.0f);
      id(heating_temperature).publish_state((int16_t) (x[13] | (x[14] << 8)));
      id(room_temperature).publish_state((int16_t) (x[15] | (x[16] << 8)));
      id(heater_set_point).publish_state(x[9]);
      if (running_state == 0 && step == 0) {
        id(fan_speed).publish_state(0);
      } else if (actual_level >= 0) {
        id(fan_speed).publish_state(actual_level);
      }

      // Keep the controls in sync with the heater (also when changed on the panel or the app)
      if (mode == 1 || mode == 2) {
        id(current_mode) = mode;
        const size_t option = mode == 1 ? 0 : 1;  // index in the "Heater Mode" options
        auto active = id(heater_mode).active_index();
        if (!active.has_value() || *active != option) {
          id(heater_mode).publish_state(std::string(option == 0 ? "Level" : "Automatic"));
        }
      }
      if (set_level >= 1 && set_level <= 10) {
        id(current_set_level) = set_level;
        if (!id(heater_level).has_state() || id(heater_level).state != set_level) {
          id(heater_level).publish_state(set_level);
        }
      }
      if (set_temp >= 8 && set_temp <= 36) {
        id(current_set_temp) = set_temp;
        if (!id(heater_temperature).has_state() || id(heater_temperature).state != set_temp) {
          id(heater_temperature).publish_state(set_temp);
        }
      }
      // Timed heating ends when the heater is turned off on the panel or in the app
      if (id(timer_off_at) != 0 && running_state == 0 && millis() - id(timer_started_ms) > 60000) {
        ESP_LOGI("timer", "Heater turned off, timed heating cancelled");
        id(timer_off_at) = 0;
        id(update_timer_remaining).execute();
      }
      if (id(heater_power).state != (running_state > 0)) {
        id(heater_power).publish_state(running_state > 0);
      }
      return x.size();

# Switches
switch:
  - platform: template
    name: "Heater Power"
    id: heater_power
    icon: "mdi:radiator"
    turn_on_action:
      - script.execute:
          id: send_command
          cmd: 3
          value: 1
    turn_off_action:
      - lambda: "id(timer_off_at) = 0;"
      - script.execute:
          id: send_command
          cmd: 3
          value: 0
      - script.execute: update_timer_remaining

  - platform: template
    name: "Timer Enabled"
    id: timer_enabled
    icon: "mdi:timer-cog-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

# Select for mode
select:
  - platform: template
    name: "Heater Mode"
    id: heater_mode
    options:
      - "Level"
      - "Automatic"
    set_action:
      - lambda: "id(current_mode) = 0;"  # force the mode command to be sent
      - script.execute:
          id: ensure_mode
          target_mode: !lambda 'return x == "Automatic" ? 2 : 1;'

  - platform: template
    name: "Timer Days"
    id: timer_days
    icon: "mdi:calendar-week"
    options:
      - "Every day"
      - "Weekdays"
      - "Weekend"
      - "Once"
    initial_option: "Every day"
    optimistic: true
    restore_value: true

number:
  - platform: template
    name: "Timer Duration"
    id: timer_duration
    min_value: 10
    max_value: 720
    step: 10
    initial_value: 60
    unit_of_measurement: "min"
    icon: "mdi:timer-outline"
    mode: box
    optimistic: true
    restore_value: true

  - platform: template
    name: "Heater Temperature"
    id: heater_temperature
    min_value: 8
    max_value: 36
    step: 1
    unit_of_measurement: "°C"
    icon: "mdi:thermometer"
    set_action:
      - script.execute:
          id: set_temperature
          temperature: !lambda "return (int) x;"

  - platform: template
    name: "Heater LEVEL"
    id: heater_level
    min_value: 1
    max_value: 10
    step: 1
    icon: "mdi:format-list-numbered"
    set_action:
      - script.execute:
          id: set_level
          level: !lambda "return (int) x;"

button:
  - platform: template
    name: "Level Up"
    icon: "mdi:chevron-up"
    on_press:
      - script.execute:
          id: set_level
          level: !lambda "return std::min(10, id(current_set_level) + 1);"

  - platform: template
    name: "Level Down"
    icon: "mdi:chevron-down"
    on_press:
      - script.execute:
          id: set_level
          level: !lambda "return std::max(1, id(current_set_level) - 1);"

  - platform: template
    name: "Temperature Up"
    icon: "mdi:thermometer-plus"
    on_press:
      - script.execute:
          id: set_temperature
          temperature: !lambda "return std::min(36, id(current_set_temp) + 1);"

  - platform: template
    name: "Temperature Down"
    icon: "mdi:thermometer-minus"
    on_press:
      - script.execute:
          id: set_temperature
          temperature: !lambda "return std::max(8, id(current_set_temp) - 1);"

  - platform: template
    name: "Refresh Status"
    icon: "mdi:refresh"
    entity_category: diagnostic
    on_press:
      - script.execute:
          id: send_command
          cmd: 1
          value: 0

  - platform: template
    name: "Timed Heating Start"
    icon: "mdi:timer-play-outline"
    on_press:
      - script.execute: start_timed_heating

  - platform: template
    name: "Timed Heating Stop"
    icon: "mdi:timer-stop-outline"
    on_press:
      - switch.turn_off: heater_power

  - platform: restart
    name: "Restart ESP"
    entity_category: diagnostic

# Time from Home Assistant (time zone of Home Assistant), used by the timer
time:
  - platform: homeassistant
    id: ha_time

datetime:
  - platform: template
    name: "Timer Start Time"
    id: timer_start_time
    type: time
    optimistic: true
    restore_value: true
    initial_value: "06:00:00"
    time_id: ha_time
    on_time:
      - if:
          condition:
            lambda: |-
              if (!id(timer_enabled).state) return false;
              // day_of_week: 1 = Sunday ... 7 = Saturday
              const int day = id(ha_time).now().day_of_week;
              const bool weekend = day == 1 || day == 7;
              const auto days = id(timer_days).active_index().value_or(0);
              return days == 0 || days == 3 || (days == 1 && !weekend) || (days == 2 && weekend);
          then:
            - script.execute: start_timed_heating
            - if:
                condition:
                  lambda: "return id(timer_days).active_index().value_or(0) == 3;"
                then:
                  - switch.turn_off: timer_enabled
